apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laravel-network-policy
  namespace: laravel-app
spec:
  podSelector:
    matchLabels:
      app: laravel-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # Allow ingress controller
    - podSelector:
        matchLabels:
          app: laravel-app  # Allow pod-to-pod communication
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mysql  # Allow access to MySQL
    ports:
    - protocol: TCP
      port: 3306
  - to: []  # Allow all outbound traffic (for external APIs, etc.)
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: UDP
      port: 53  # DNS
