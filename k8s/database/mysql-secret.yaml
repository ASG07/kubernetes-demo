apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: laravel-app
type: Opaque
data:
  # Base64 encoded values - replace with your actual encoded secrets
  # To encode: echo -n 'your-password' | base64
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk  # 'rootpassword' - replace with actual root password
  MYSQL_PASSWORD: cGFzc3dvcmQ=  # 'password' - replace with actual user password
