apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: laravel-app
  labels:
    app: mysql
    tier: database
spec:
  selector:
    app: mysql
    tier: database
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless-service
  namespace: laravel-app
  labels:
    app: mysql
    tier: database
spec:
  selector:
    app: mysql
    tier: database
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  clusterIP: None
