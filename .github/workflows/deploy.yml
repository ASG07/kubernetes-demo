  #     run: php artisan test

  build-and-push:
    # needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/simpler-setup'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.simple
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:latest
          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }}

    - name: Update Kubernetes manifests with new image
      run: |
        sed -i "s|your-registry/laravel:latest|${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g" k8s-simple/laravel.yaml

    - name: Deploy to GKE
      run: |
        kubectl apply -f k8s-simple/namespace.yaml
        kubectl apply -f k8s-simple/configmap.yaml
        kubectl apply -f k8s-simple/secret.yaml
        kubectl apply -f k8s-simple/mysql.yaml
        kubectl apply -f k8s-simple/laravel.yaml

    - name: Wait for deployment
      run: |
        kubectl wait --for=condition=available deployment/laravel -n laravel --timeout=300s

    - name: Get service info
      run: |
        kubectl get services -n laravel
        echo "🎉 Deployment completed successfully!"
